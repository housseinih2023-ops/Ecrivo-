name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Identifiant d'application AdMob
      ADMOB_APP_ID: ca-app-pub-2975476357970858~2175191361
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: npm run prep
      - run: npx cap add android
      - name: Identifiant AdMob
        run: |
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" android/app/src/main/AndroidManifest.xml
          grep -c APPLICATION_ID android/app/src/main/AndroidManifest.xml
      - run: npx cap sync
      - name: Clé de signature stable
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "SHA1|SHA256"
          fi
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ecrivo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
