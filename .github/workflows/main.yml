name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap init Ecrivo com.ecrivo.app --web-dir=www || true
      - run: npx cap add android
      - run: |
          mkdir -p www
          if [ -f index.html ] && [ ! -f www/index.html ]; then cp index.html www/; fi
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          ls -la www
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ecrivo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
